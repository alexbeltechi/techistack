name: Something went wrong
description: A command failed, or the output looks wrong
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying techistack. Please don't attach photos you don't want public; a description or a screenshot of the sheet is enough.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked for, what you got, and what you expected.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command the agent ran (or the slash command you used) and what it printed. Paths can be shortened.
      render: shell
  - type: input
    id: system
    attributes:
      label: System
      description: OS, Node version (`node --version`), agent (e.g. Claude Code 2.x)
      placeholder: macOS 26, Node 24, Claude Code
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: techistack version
      description: From `.claude-plugin/plugin.json` or the release you installed
      placeholder: 0.4.0
